<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Novel Flow — a literary studio for planning branching novels." />
    <title>Novel Flow</title>
    <script>
      // Apply the saved theme before first paint (no flash).
      (function () {
        var mode = 'system';
        try { mode = localStorage.getItem('novel-flow-theme') || 'system'; } catch (e) {}
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
